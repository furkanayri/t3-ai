# Yerel Postgres. Host PostgreSQL'e Docker'dan erisilemedigi icin kullanilir.
# Host portu 5433: makinedeki PostgreSQL 5432'yi kullanmaya devam eder.

services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-platform-postgres
    environment:
      POSTGRES_USER: ai_platform_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ai_platform
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ai_platform_pg:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_platform_user -d ai_platform"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    mem_limit: 512m

  llm-api:
    depends_on:
      postgres:
        condition: service_healthy

  ai-worker:
    depends_on:
      postgres:
        condition: service_healthy

  outbox-publisher:
    depends_on:
      postgres:
        condition: service_healthy

  retry-dispatcher:
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  ai_platform_pg:
