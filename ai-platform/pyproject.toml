[project]
name = "ai-platform"
version = "0.1.0"
description = "Merkezi LLM job platformu (FastAPI + PostgreSQL + Kafka + Ollama)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "sqlalchemy==2.0.36",
    "psycopg[binary]==3.2.3",
    "alembic==1.14.0",
    "confluent-kafka==2.6.1",
    "httpx==0.28.1",
    "jsonschema==4.23.0",
    "prometheus-client==0.21.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "anyio==4.7.0",
    "ruff==0.8.4",
    "mypy==1.14.0",
    "types-jsonschema==4.23.0.20241208",
    "locust==2.32.4",
]

[project.scripts]
ai-platform = "app.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "C4", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B008", "SIM117"]
"migrations/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
packages = ["app"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
strict = true
disallow_untyped_decorators = false
warn_unused_ignores = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "integration: PostgreSQL ve mock servisler gerektiren testler",
    "e2e: uctan uca akis testleri",
    "smoke: gercek Ollama/GPU gerektiren testler",
]
